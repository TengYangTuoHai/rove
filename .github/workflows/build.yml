name: Build packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test version management and installer collection
        run: go test ./cmd/version ./scripts

      - name: Resolve version and validate release tag
        id: version
        run: go run ./cmd/version ci

  build:
    name: Build ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            runner: macos-latest
            platforms: darwin/arm64,darwin/amd64
          - os: windows
            runner: windows-latest
            platforms: windows/amd64
          - os: linux
            runner: ubuntu-latest
            platforms: linux/arm64,linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Apply package version
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: go run ./cmd/version set "$BUILD_VERSION"

      - name: Build packages with bundled hc
        env:
          PLATFORMS: ${{ matrix.platforms }}
        run: go tool mygo build -platform "$PLATFORMS"

      - name: Collect native installers
        env:
          TARGET_OS: ${{ matrix.os }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/collect-installers.sh "$TARGET_OS" "$BUILD_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rove-${{ matrix.os }}
          path: |
            artifacts/*.dmg
            artifacts/*-setup-*.exe
            artifacts/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rove-*
          path: artifacts
          merge-multiple: true

      - name: Publish native installers
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/rove-${{ needs.version.outputs.version }}-arm64.dmg
            artifacts/rove-${{ needs.version.outputs.version }}-amd64.dmg
            artifacts/rove-setup-${{ needs.version.outputs.version }}-amd64.exe
            artifacts/rove_*_arm64.deb
            artifacts/rove_*_amd64.deb
